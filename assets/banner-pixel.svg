<rect width="1000" height="240" fill="url(#glow)"/>
<rect width="1000" height="240" fill="url(#dots)" mask="url(#m)"/>
<text x="56" y="64" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" fill="#4E7E9E" letter-spacing="4.5">MALANG, INDONESIA</text>
<text x="54" y="128" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#F2F7FC" letter-spacing="-1">EGA YURCEL</text>
<text x="54" y="178" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#74B6EC" letter-spacing="-1">SATRIAJI<tspan fill="#E9A94F">.</tspan></text>
<text x="56" y="210" font-family="Consolas, 'Liberation Mono', monospace" font-size="15" fill="#90AAC0" letter-spacing="2.5">Software Engineer</text>
<rect x="0.5" y="0.5" width="999" height="239" rx="10" fill="none" stroke="#1C3040"/>
