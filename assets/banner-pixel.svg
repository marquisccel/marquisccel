<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
<title id="t">Ega Yurcel Satriaji — Software Engineer</title>
<desc id="d">A terminal window typing itself out: whoami returns Ega Yurcel Satriaji, cat role.txt returns Software Engineer, and ls focus/ lists backend, cloud and devops.</desc>
<style>
.t1{transform:translateX(68px) scaleX(0);animation:t1 13s steps(6,end) infinite}
@keyframes t1{0%,3%{transform:translateX(68px) scaleX(0)}
10%,95%{transform:translateX(68px) scaleX(1)}
97%,100%{transform:translateX(68px) scaleX(0)}}
.t2{transform:translateX(68px) scaleX(0);animation:t2 13s steps(12,end) infinite}
@keyframes t2{0%,20%{transform:translateX(68px) scaleX(0)}
32%,95%{transform:translateX(68px) scaleX(1)}
97%,100%{transform:translateX(68px) scaleX(0)}}
.t3{transform:translateX(68px) scaleX(0);animation:t3 13s steps(9,end) infinite}
@keyframes t3{0%,42%{transform:translateX(68px) scaleX(0)}
51%,95%{transform:translateX(68px) scaleX(1)}
97%,100%{transform:translateX(68px) scaleX(0)}}
.k1{opacity:0;animation:k1 13s steps(6,end) infinite}
@keyframes k1{0%,2.9%{opacity:0;transform:translateX(0)}
3%{opacity:1;transform:translateX(0)}
10%{opacity:1;transform:translateX(43px)}
10.1%,100%{opacity:0;transform:translateX(43px)}}
.k2{opacity:0;animation:k2 13s steps(12,end) infinite}
@keyframes k2{0%,19.9%{opacity:0;transform:translateX(0)}
20%{opacity:1;transform:translateX(0)}
32%{opacity:1;transform:translateX(86px)}
32.1%,100%{opacity:0;transform:translateX(86px)}}
.k3{opacity:0;animation:k3 13s steps(9,end) infinite}
@keyframes k3{0%,41.9%{opacity:0;transform:translateX(0)}
42%{opacity:1;transform:translateX(0)}
51%{opacity:1;transform:translateX(64px)}
51.1%,100%{opacity:0;transform:translateX(64px)}}
.o1{opacity:0;animation:o1 13s steps(1,end) infinite}
@keyframes o1{0%,13%{opacity:0}14%,95%{opacity:1}96%,100%{opacity:0}}
.o2{opacity:0;animation:o2 13s steps(1,end) infinite}
@keyframes o2{0%,35%{opacity:0}36%,95%{opacity:1}96%,100%{opacity:0}}
.o3{opacity:0;animation:o3 13s steps(1,end) infinite}
@keyframes o3{0%,54%{opacity:0}55%,95%{opacity:1}96%,100%{opacity:0}}
.o4{opacity:0;animation:o4 13s steps(1,end) infinite}
@keyframes o4{0%,57%{opacity:0}58%,95%{opacity:1}96%,100%{opacity:0}}
.cur{animation:cur 1.1s steps(1,end) infinite}
@keyframes cur{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){
.t1,.t2,.t3,.o1,.o2,.o3,.o4,.cur{animation:none}
.t1,.t2,.t3{transform:translateX(68px) scaleX(1)}
.o1,.o2,.o3,.o4{opacity:1}.k1,.k2,.k3{display:none}}
</style>
<defs>
<clipPath id="fr"><rect width="1000" height="300" rx="8"/></clipPath>
<clipPath id="c1"><rect class="t1" x="0" y="48" width="43" height="20"/></clipPath>
<clipPath id="c2"><rect class="t2" x="0" y="136" width="86" height="20"/></clipPath>
<clipPath id="c3"><rect class="t3" x="0" y="202" width="64" height="20"/></clipPath>
</defs>
<g clip-path="url(#fr)">
<rect width="1000" height="300" fill="#16222F"/>
<rect x="16" y="12" width="968" height="276" fill="#0B1620"/>
<rect x="16" y="12" width="968" height="16" fill="#22384A"/>
<rect x="32" y="16" width="8" height="8" fill="#C9676B"/>
<rect x="44" y="16" width="8" height="8" fill="#D9A85E"/>
<rect x="56" y="16" width="8" height="8" fill="#6FC3A0"/>
<rect x="16" y="28" width="968" height="1" fill="#17293A"/>
<text x="500" y="25" text-anchor="middle" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5C85A6" letter-spacing="2">marquisccel &#8212; zsh</text>

<text x="48" y="62" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#5FB0E0">$</text>
<g clip-path="url(#c1)"><text x="68" y="62" textLength="43" lengthAdjust="spacing" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#DCE8F5">whoami</text></g>
<rect class="k1" x="68" y="51" width="7" height="14" fill="#8FD2F4"/>

<text class="o1" x="48" y="112" font-family="Consolas, 'Liberation Mono', monospace" font-size="38" fill="#6FC3A0" letter-spacing="1">EGA YURCEL SATRIAJI</text>

<text class="o1" x="48" y="150" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#5FB0E0">$</text>
<g clip-path="url(#c2)"><text x="68" y="150" textLength="86" lengthAdjust="spacing" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#DCE8F5">cat role.txt</text></g>
<rect class="k2" x="68" y="139" width="7" height="14" fill="#8FD2F4"/>

<text class="o2" x="48" y="178" font-family="Consolas, 'Liberation Mono', monospace" font-size="17" fill="#6FC3A0" letter-spacing="1">Software Engineer</text>

<text class="o2" x="48" y="216" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#5FB0E0">$</text>
<g clip-path="url(#c3)"><text x="68" y="216" textLength="64" lengthAdjust="spacing" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#DCE8F5">ls focus/</text></g>
<rect class="k3" x="68" y="205" width="7" height="14" fill="#8FD2F4"/>

<g class="o3" font-family="Consolas, 'Liberation Mono', monospace" font-size="15" fill="#6FC3A0">
<text x="48" y="244">backend/</text>
<text x="168" y="244">cloud/</text>
<text x="264" y="244">devops/</text>
<text x="376" y="244">systems/</text>
</g>

<text class="o4" x="48" y="274" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#5FB0E0">$<tspan class="cur" fill="#8FD2F4"> _</tspan></text>
<rect x="0.5" y="0.5" width="999" height="299" rx="8" fill="none" stroke="#17293A"/>
</g>
</svg>
