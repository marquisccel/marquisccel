<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-labelledby="t d">
<title id="t">Ega Yurcel Satriaji — Software Engineer</title>
<desc id="d">Name card: Ega Yurcel Satriaji, Software Engineer, Malang, Indonesia.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0A1420"/>
<stop offset="1" stop-color="#132537"/>
</linearGradient>
<radialGradient id="glow" cx="0.80" cy="0.16" r="0.72">
<stop offset="0" stop-color="#2E6694" stop-opacity=".40"/>
<stop offset="1" stop-color="#2E6694" stop-opacity="0"/>
</radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<rect x="0" y="0" width="2" height="2" fill="#2A4A68"/>
</pattern>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
<stop offset="0.28" stop-color="#fff" stop-opacity="0"/>
<stop offset="1" stop-color="#fff" stop-opacity=".55"/>
</linearGradient>
<mask id="m"><rect width="1000" height="240" fill="url(#fade)"/></mask>
<clipPath id="fr"><rect width="1000" height="240" rx="10"/></clipPath>
