<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-labelledby="t d">
<title id="t">Ega Yurcel Satriaji — Software Engineer</title>
<desc id="d">A terminal window: whoami returns Ega Yurcel Satriaji, the role reads Software Engineer, located in Malang, Indonesia.</desc>
<style>
.cur{animation:cur 1.1s steps(1,end) infinite}
@keyframes cur{50%{opacity:0}}
.ln{animation:ln .5s ease-out both}
@keyframes ln{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cur,.ln{animation:none}.ln{opacity:1}}
</style>
<defs><clipPath id="fr"><rect width="1000" height="240" rx="8"/></clipPath></defs>
<g clip-path="url(#fr)">
<rect width="1000" height="240" fill="#16222F"/>
<rect x="16" y="12" width="968" height="216" fill="#0B1620"/>
<rect x="16" y="12" width="968" height="16" fill="#22384A"/>
<rect x="32" y="16" width="8" height="8" fill="#C9676B"/>
<rect x="44" y="16" width="8" height="8" fill="#D9A85E"/>
<rect x="56" y="16" width="8" height="8" fill="#6FC3A0"/>
<rect x="16" y="28" width="968" height="1" fill="#17293A"/>
<text x="500" y="25" text-anchor="middle" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5C85A6" letter-spacing="2">marquisccel &#8212; zsh</text>

<g class="ln" style="animation-delay:.05s">
<text x="48" y="62" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#5FB0E0">$</text>
<text x="68" y="62" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#DCE8F5">whoami</text>
</g>
<g class="ln" style="animation-delay:.35s">
<text x="48" y="112" font-family="Consolas, 'Liberation Mono', monospace" font-size="38" font-weight="700" fill="#F2F7FC" letter-spacing="-0.5">EGA YURCEL <tspan fill="#74B6EC">SATRIAJI</tspan></text>
</g>
<g class="ln" style="animation-delay:.65s">
<text x="48" y="150" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#5FB0E0">$</text>
<text x="68" y="150" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#DCE8F5">cat role.txt</text>
</g>
<g class="ln" style="animation-delay:.95s">
<text x="48" y="178" font-family="Consolas, 'Liberation Mono', monospace" font-size="17" fill="#6FC3A0" letter-spacing="1">Software Engineer</text>
</g>
<g class="ln" style="animation-delay:1.25s">
<text x="48" y="208" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#5FB0E0">$<tspan class="cur" fill="#8FD2F4"> _</tspan></text>
</g>
<text x="952" y="208" text-anchor="end" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" fill="#3E6A90" letter-spacing="2">Malang, Indonesia</text>
<rect x="0.5" y="0.5" width="999" height="239" rx="8" fill="none" stroke="#17293A"/>
</g>
</svg>
