<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-labelledby="t d">
<title id="t">Ega Yurcel Satriaji — Software Engineer</title>
<desc id="d">Name card: Ega Yurcel Satriaji, Software Engineer, Malang, Indonesia.</desc>
<style>
.cur{animation:cur 1.1s steps(1,end) infinite}
@keyframes cur{50%{opacity:0}}
.tw{animation:tw 4.4s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.25}}
@media (prefers-reduced-motion:reduce){.cur,.tw{animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0A1420"/>
<stop offset="1" stop-color="#132537"/>
</linearGradient>
<radialGradient id="glow" cx="0.80" cy="0.16" r="0.72">
<stop offset="0" stop-color="#2E6694" stop-opacity=".40"/>
<stop offset="1" stop-color="#2E6694" stop-opacity="0"/>
</radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<rect x="0" y="0" width="2" height="2" fill="#2A4A68"/>
</pattern>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
<stop offset="0.28" stop-color="#fff" stop-opacity="0"/>
<stop offset="1" stop-color="#fff" stop-opacity=".55"/>
</linearGradient>
<mask id="m"><rect width="1000" height="240" fill="url(#fade)"/></mask>
<clipPath id="fr"><rect width="1000" height="240" rx="10"/></clipPath>
</defs>
<g clip-path="url(#fr)">
<rect width="1000" height="240" fill="url(#bg)"/>
<rect width="1000" height="240" fill="url(#glow)"/>
<rect width="1000" height="240" fill="url(#dots)" mask="url(#m)"/>

<g fill="#8FC4E8">
<rect class="tw" x="704" y="48" width="3" height="3" style="animation-delay:0s"/>
<rect class="tw" x="836" y="92" width="3" height="3" style="animation-delay:1.1s"/>
<rect class="tw" x="770" y="160" width="3" height="3" style="animation-delay:2.2s"/>
<rect class="tw" x="924" y="60" width="3" height="3" style="animation-delay:3.3s"/>
<rect class="tw" x="880" y="182" width="3" height="3" style="animation-delay:1.7s"/>
</g>

<g fill="#27455F">
<rect x="16" y="16" width="20" height="2"/><rect x="16" y="16" width="2" height="20"/>
<rect x="964" y="16" width="20" height="2"/><rect x="982" y="16" width="2" height="20"/>
<rect x="16" y="222" width="20" height="2"/><rect x="16" y="204" width="2" height="20"/>
<rect x="964" y="222" width="20" height="2"/><rect x="982" y="204" width="2" height="20"/>
</g>

<text x="56" y="64" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" fill="#4E7E9E" letter-spacing="4.5">MALANG, INDONESIA</text>
<text x="54" y="128" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#F2F7FC" letter-spacing="-1">EGA YURCEL</text>
<text x="54" y="178" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#74B6EC" letter-spacing="-1">SATRIAJI<tspan fill="#E9A94F">.</tspan></text>
<text x="56" y="210" font-family="Consolas, 'Liberation Mono', monospace" font-size="15" fill="#90AAC0" letter-spacing="2.5">Software Engineer<tspan class="cur" fill="#74B6EC"> _</tspan></text>
<text x="944" y="210" text-anchor="end" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" fill="#3E6A90" letter-spacing="3">@marquisccel</text>
<rect x="0.5" y="0.5" width="999" height="239" rx="10" fill="none" stroke="#1C3040"/>
