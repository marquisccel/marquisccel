<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 72" width="1000" height="72" role="img" aria-labelledby="t d">
<title id="t">About</title>
<desc id="d">Software Engineer. Tech plus business mindset. Backend, cloud and DevOps. Turning IT into business value.</desc>
<style>
.p1{transform:translateX(378px) scaleX(0);animation:p1 14s steps(17,end) infinite}
@keyframes p1{0%{transform:translateX(378px) scaleX(0)}
10%,20%{transform:translateX(378px) scaleX(1)}
25%,100%{transform:translateX(378px) scaleX(0)}}
.p2{transform:translateX(335px) scaleX(0);animation:p2 14s steps(23,end) infinite}
@keyframes p2{0%,25%{transform:translateX(335px) scaleX(0)}
35%,45%{transform:translateX(335px) scaleX(1)}
50%,100%{transform:translateX(335px) scaleX(0)}}
.p3{transform:translateX(328px) scaleX(0);animation:p3 14s steps(24,end) infinite}
@keyframes p3{0%,50%{transform:translateX(328px) scaleX(0)}
60%,70%{transform:translateX(328px) scaleX(1)}
75%,100%{transform:translateX(328px) scaleX(0)}}
.p4{transform:translateX(285px) scaleX(0);animation:p4 14s steps(30,end) infinite}
@keyframes p4{0%,75%{transform:translateX(285px) scaleX(0)}
85%,95%{transform:translateX(285px) scaleX(1)}
100%{transform:translateX(285px) scaleX(0)}}
.k1{animation:k1 14s steps(17,end) infinite}
@keyframes k1{0%{opacity:1;transform:translateX(378px)}
10%,20%{opacity:1;transform:translateX(621px)}
25%{opacity:1;transform:translateX(378px)}
25.5%,100%{opacity:0;transform:translateX(378px)}}
.k2{opacity:0;animation:k2 14s steps(23,end) infinite}
@keyframes k2{0%,24.5%{opacity:0;transform:translateX(335px)}
25%{opacity:1;transform:translateX(335px)}
35%,45%{opacity:1;transform:translateX(664px)}
50%{opacity:1;transform:translateX(335px)}
50.5%,100%{opacity:0;transform:translateX(335px)}}
.k3{opacity:0;animation:k3 14s steps(24,end) infinite}
@keyframes k3{0%,49.5%{opacity:0;transform:translateX(328px)}
50%{opacity:1;transform:translateX(328px)}
60%,70%{opacity:1;transform:translateX(671px)}
75%{opacity:1;transform:translateX(328px)}
75.5%,100%{opacity:0;transform:translateX(328px)}}
.k4{opacity:0;animation:k4 14s steps(30,end) infinite}
@keyframes k4{0%,74.5%{opacity:0;transform:translateX(285px)}
75%{opacity:1;transform:translateX(285px)}
85%,95%{opacity:1;transform:translateX(714px)}
100%{opacity:1;transform:translateX(285px)}}
@media (prefers-reduced-motion:reduce){
.p1{animation:none;transform:translateX(378px) scaleX(1)}
.p2,.p3,.p4{animation:none}
.k1,.k2,.k3,.k4{animation:none;opacity:0}}
</style>
<defs>
<clipPath id="q1"><rect class="p1" x="0" y="18" width="243" height="36"/></clipPath>
<clipPath id="q2"><rect class="p2" x="0" y="18" width="329" height="36"/></clipPath>
<clipPath id="q3"><rect class="p3" x="0" y="18" width="343" height="36"/></clipPath>
<clipPath id="q4"><rect class="p4" x="0" y="18" width="429" height="36"/></clipPath>
</defs>
<g font-family="Consolas, 'Liberation Mono', monospace" font-size="26" fill="#2EA880" lengthAdjust="spacing" text-anchor="middle">
<g clip-path="url(#q1)"><text x="500" y="46" textLength="243">Software Engineer</text></g>
<g clip-path="url(#q2)"><text x="500" y="46" textLength="329">Tech + Business Mindset</text></g>
<g clip-path="url(#q3)"><text x="500" y="46" textLength="343">Backend / Cloud / DevOps</text></g>
<g clip-path="url(#q4)"><text x="500" y="46" textLength="429">Turning IT into business value</text></g>
</g>
<rect class="k1" x="0" y="24" width="12" height="26" fill="#2EA880"/>
<rect class="k2" x="0" y="24" width="12" height="26" fill="#2EA880"/>
<rect class="k3" x="0" y="24" width="12" height="26" fill="#2EA880"/>
<rect class="k4" x="0" y="24" width="12" height="26" fill="#2EA880"/>
</svg>
