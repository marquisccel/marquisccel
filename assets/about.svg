<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 72" width="1000" height="72" role="img" aria-labelledby="t d">
<title id="t">About</title>
<desc id="d">Turning IT into business value.</desc>
<style>
.p1{transform:translateX(278px) scaleX(0);animation:p1 10s steps(31,end) infinite}
@keyframes p1{0%,3%{transform:translateX(278px) scaleX(0)}
23%,96%{transform:translateX(278px) scaleX(1)}
100%{transform:translateX(278px) scaleX(0)}}
.kpos{transform:translateX(278px);animation:kpos 10s steps(31,end) infinite}
@keyframes kpos{0%,3%{transform:translateX(278px)}
23%,96%{transform:translateX(721px)}
100%{transform:translateX(278px)}}
.blink{animation:blink 1.1s steps(1,end) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){
.p1{animation:none;transform:translateX(278px) scaleX(1)}
.kpos{animation:none;transform:translateX(721px)}
.blink{animation:none}}
</style>
<defs>
<clipPath id="q1"><rect class="p1" x="0" y="18" width="443" height="36"/></clipPath>
</defs>
<g clip-path="url(#q1)">
<text x="500" y="46" text-anchor="middle" textLength="443" lengthAdjust="spacing" font-family="Consolas, 'Liberation Mono', monospace" font-size="26" fill="#2EA880">Turning IT into business value.</text>
</g>
<g class="kpos"><rect class="blink" x="2" y="24" width="12" height="26" fill="#2EA880"/></g>
</svg>
