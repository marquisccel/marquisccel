<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-labelledby="t2 d2">
<title id="t2">Terminal</title>
<desc id="d2">A looping pixel terminal printing a build: npm run build, terraform apply and git push, each line appearing in turn.</desc>
<style>
.tl{animation:tl 12s steps(1,end) infinite;opacity:0}
@keyframes tl{0%{opacity:0}2%{opacity:1}86%{opacity:1}92%,100%{opacity:0}}
.cur2{animation:cur2 1.1s steps(1,end) infinite}
@keyframes cur2{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.tl{animation:none;opacity:1}.cur2{animation:none}}
</style>
<defs><clipPath id="fr2"><rect width="1000" height="170" rx="8"/></clipPath></defs>
<g clip-path="url(#fr2)" shape-rendering="crispEdges"><rect width="1000" height="170" fill="#141E33"/><rect x="16" y="12" width="968" height="144" fill="#0B1424"/><rect x="16" y="12" width="968" height="16" fill="#223149"/><rect x="32" y="16" width="8" height="8" fill="#C9676B"/><rect x="44" y="16" width="8" height="8" fill="#D9A85E"/><rect x="56" y="16" width="8" height="8" fill="#6FC3A0"/><rect x="16" y="28" width="968" height="4" fill="#16243C"/></g>
<g clip-path="url(#fr2)">
<text x="500" y="25" text-anchor="middle" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5C7CA6" letter-spacing="2">marquisccel &#8212; build</text>
<g class="tl" style="animation-delay:0.0s"><text x="36" y="48" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#5FB0E0">$</text><text x="56" y="48" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#DCE8F5">npm run build</text></g><g class="tl" style="animation-delay:1.5s"><text x="56" y="65" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6FC3A0">compiled in 2.1s</text></g><g class="tl" style="animation-delay:3.0s"><text x="36" y="82" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#5FB0E0">$</text><text x="56" y="82" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#DCE8F5">terraform apply</text></g><g class="tl" style="animation-delay:4.5s"><text x="56" y="99" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6FC3A0">12 added, 0 destroyed</text></g><g class="tl" style="animation-delay:6.0s"><text x="36" y="116" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#5FB0E0">$</text><text x="56" y="116" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#DCE8F5">git push origin main</text></g><g class="tl" style="animation-delay:7.5s"><text x="56" y="133" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#E9A94F">main -> main</text></g><text x="36" y="150" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#5FB0E0">$</text><rect class="cur2" x="56" y="139" width="8" height="14" fill="#8FD2F4"/>
<rect x="0.5" y="0.5" width="999" height="169" rx="8" fill="none" stroke="#16253C"/>
</g></svg>