<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-labelledby="t2 d2">
<title id="t2">Terminal</title>
<desc id="d2">A looping pixel terminal running git add, git commit and git push, one line at a time.</desc>
<style>
.tl{animation:tl 11s steps(1,end) infinite;opacity:0}
@keyframes tl{0%{opacity:0}2%{opacity:1}86%{opacity:1}92%,100%{opacity:0}}
.cur2{animation:cur2 1.1s steps(1,end) infinite}
@keyframes cur2{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.tl{animation:none;opacity:1}.cur2{animation:none}}
</style>
<defs><clipPath id="fr2"><rect width="1000" height="170" rx="8"/></clipPath></defs>
<g clip-path="url(#fr2)" shape-rendering="crispEdges"><rect width="1000" height="170" fill="#16222F"/><rect x="16" y="12" width="968" height="144" fill="#0B1620"/><rect x="16" y="12" width="968" height="16" fill="#22384A"/><rect x="32" y="16" width="8" height="8" fill="#C9676B"/><rect x="44" y="16" width="8" height="8" fill="#D9A85E"/><rect x="56" y="16" width="8" height="8" fill="#6FC3A0"/><rect x="16" y="28" width="968" height="4" fill="#17293A"/></g>
<g clip-path="url(#fr2)">
<text x="500" y="25" text-anchor="middle" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" fill="#5C85A6" letter-spacing="2">marquisccel &#8212; git</text>
<g class="tl" style="animation-delay:0.0s"><text x="36" y="50" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#5FB0E0">$</text><text x="56" y="50" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#DCE8F5">git add .</text></g><g class="tl" style="animation-delay:1.6s"><text x="36" y="68" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#5FB0E0">$</text><text x="56" y="68" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#DCE8F5">git commit -m "feat: ship it"</text></g><g class="tl" style="animation-delay:3.2s"><text x="56" y="86" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6FC3A0">1 file changed, 42 insertions(+)</text></g><g class="tl" style="animation-delay:4.8s"><text x="36" y="104" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#5FB0E0">$</text><text x="56" y="104" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#DCE8F5">git push origin main</text></g><g class="tl" style="animation-delay:6.4s"><text x="56" y="122" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#E9A94F">main -> main</text></g><text x="36" y="140" font-family="Consolas, 'Liberation Mono', monospace" font-size="13" fill="#5FB0E0">$</text><rect class="cur2" x="56" y="129" width="8" height="14" fill="#8FD2F4"/>
<rect x="0.5" y="0.5" width="999" height="169" rx="8" fill="none" stroke="#17293A"/>
</g></svg>