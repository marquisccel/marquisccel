<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-labelledby="t2 d2">
<title id="t2">Commit graph</title>
<desc id="d2">A looping pixel animation of a git commit graph: a main line with a feature branch above it and a hotfix branch below, lighting up commit by commit.</desc>
<style>
.cm{animation:cm 12s linear infinite;opacity:0}
@keyframes cm{0%{opacity:0}2%{opacity:1}72%{opacity:1}80%{opacity:0}100%{opacity:0}}
.hd{animation:hd 12s linear infinite;opacity:.9}
@keyframes hd{0%{transform:translateX(0)}78%{transform:translateX(880px)}
80%,100%{transform:translateX(880px);opacity:0}}
@media (prefers-reduced-motion:reduce){.cm{animation:none;opacity:1}.hd{animation:none;opacity:0}}
</style>
<defs><clipPath id="fr2"><rect width="1000" height="150" rx="8"/></clipPath></defs>
